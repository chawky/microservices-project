version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: study
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - aouki  # Add this line to connect mysql to the aouki network
  msoauth:
    image: aouki/oauthms:v1
    container_name: msoauth
    depends_on:
      - mysql
    ports:
      - "7090:8090"
    networks:
      - aouki
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/study?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    restart: on-failure
  jwtoauth:
    image: aouki/jwtauth:v1
    container_name: jwtauth
    depends_on:
      - mysql
    ports:
      - "7080:8080"
    networks:
      - aouki
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/study?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    restart: on-failure
  mainms:
    image: aouki/mainms:v1
    container_name: mainms
    depends_on:
      - mysql
    ports:
      - "7070:8070"
    networks:
      - aouki
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/study?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    restart: on-failure
volumes:
  mysql_data:
networks:
  aouki:
    driver: "bridge"
