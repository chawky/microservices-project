# Database - production
spring.datasource.url=jdbc:mysql://prod-db-host:3306/production_db?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT - stronger production secret
spring.jwt.secret=${JWT_SECRET}

# Email - production credentials
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.debug=false

# Verification URL - production
app.verification-url=https://yourdomain.com/auth/verify
